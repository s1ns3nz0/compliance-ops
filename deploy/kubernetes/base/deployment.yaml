apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-ops
  labels:
    app.kubernetes.io/name: compliance-ops
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: compliance-ops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compliance-ops
    spec:
      serviceAccountName: compliance-ops
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Single Go binary: HTTP API + embedded web UI (see Dockerfile).
          image: REPLACE_WITH_APPROVED_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            # Evidence uploads are spooled to a temp file before being streamed
            # to object storage; /tmp is the emptyDir mounted below.
            - name: TMPDIR
              value: /tmp
            - name: COMPLIANCE_API_TOKENS_FILE
              value: /run/secrets/compliance-api-tokens.json
          envFrom:
            # Non-secret runtime settings. Required keys are listed in ../README.md.
            - configMapRef:
                name: compliance-ops-runtime
            # Credentials. The Secret is created out-of-band per environment; it
            # is intentionally not defined in this repository.
            - secretRef:
                name: compliance-ops-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: api-tokens
              mountPath: /run/secrets
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            # Bounded scratch space for upload spooling (default max upload 50 MiB
            # per request; size for concurrent uploads).
            sizeLimit: 512Mi
        - name: api-tokens
          secret:
            secretName: compliance-ops-secrets
            defaultMode: 0440
            items:
              - key: compliance-api-tokens.json
                path: compliance-api-tokens.json
                mode: 0440
